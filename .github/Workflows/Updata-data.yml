name: Update market data

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 8:00 pm India time, Monday to Friday
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install requests yfinance
      - name: Download NSE data
        run: python fetch_data.py
      - name: Publish the official analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node nightly.js
      - name: Save the new data
        if: always()
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Market data update $(date -u +%F)"
          git push
